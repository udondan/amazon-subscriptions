[project]
name = "amazon-subscriptions"
version = "1.1.1"
description = "Unofficial tool to read Amazon Subscribe & Save subscriptions and upcoming deliveries as JSON (read-only)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Daniel Schroeder" }]
requires-python = ">=3.11"
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "amazon-auth>=1.0.0,<2",
    "beautifulsoup4==4.15.0",
    "click==8.5.1",
]

[project.scripts]
amazon-subscriptions = "amazon_subscriptions.cli:cli"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "responses==0.26.3",
    "ruff==0.17.4",
    "types-requests==2.33.0.20261030",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amazon_subscriptions"]

[tool.ruff]
line-length = 119
target-version = "py311"
extend-exclude = ["scripts/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["amazon_subscriptions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
