# Checks the links of README.md (see .github/workflows/lint.yml).

cache = true
max_cache_age = "1d"
max_retries = 3
retry_wait_time = 5
timeout = 30

# Rate limiting (e.g. by GitHub) says nothing about whether a link works.
accept = ["200..=299", "429"]

exclude_path = [
  # Generated by release-please, and its compare/commit links are fixed history.
  "CHANGELOG.md",
  ".venv",
  ".claude",
]
