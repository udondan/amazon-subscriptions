# Used by Qlty Cloud and by the qlty job of mr-test.yml. The plugins are the ones `qlty init` enables for this
# repository. All of them and the code smells block, so a finding fails the job.
#
# Guide: https://qlty.sh/d/config, reference: https://qlty.sh/d/qlty-toml
config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
  "**/.claude/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "block"

# Counts self, and functions with this many parameters are reported. SubscriptionsClient.__init__ takes the session
# and five options as keyword parameters, which are its public API. Smells cannot be ignored per file.
[smells.function_parameters]
threshold = 7

[[source]]
name = "default"
default = true

[[plugin]]
name = "actionlint"

[[plugin]]
name = "bandit"

[[plugin]]
name = "radarlint-python"

[[plugin]]
name = "ripgrep"

[[plugin]]
name = "ruff"
drivers = [
  "lint",
]

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "yamllint"

[[plugin]]
name = "zizmor"

# pytest checks with assert.
[[triage]]
match.rules = ["bandit:B101"]
match.file_patterns = ["tests/**"]
set.ignored = true

# The TODOs of #41 and #42. Remove this once both are resolved.
[[triage]]
match.rules = ["ripgrep:TODO", "radarlint-python:python:S1135"]
match.file_patterns = ["amazon_subscriptions/locales/en.py"]
set.ignored = true
